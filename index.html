<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>자물쇠함 — 비밀번호로 잠그는 파일 보관함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12151c;
    --panel: #1c212b;
    --panel-raised: #232a36;
    --brass: #c79a56;
    --brass-bright: #e3b96f;
    --paper: #ede7da;
    --mute: #8890a0;
    --rust: #c1594b;
    --rust-bright: #d97767;
    --sage: #7ea28c;
    --line: rgba(199,154,86,0.28);
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background:
      radial-gradient(circle at 50% -10%, rgba(199,154,86,0.10), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(126,162,140,0.06), transparent 40%),
      var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Sans KR', sans-serif;
    min-height: 100vh;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 48px 20px 80px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 40px;
    user-select:none;
  }
  .brand .dial{
    width:30px; height:30px;
    border-radius:50%;
    border: 2px solid var(--brass);
    position:relative;
    flex-shrink:0;
  }
  .brand .dial::after{
    content:"";
    position:absolute;
    top:3px; left:50%;
    width:2px; height:9px;
    background: var(--brass);
    transform: translateX(-50%);
  }
  .brand span{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing: -0.01em;
  }
  .brand small{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--mute);
    letter-spacing: 0.06em;
    margin-top:2px;
    font-weight:400;
  }

  main{ width:100%; max-width: 460px; }

  .panel{
    position:relative;
    background: var(--panel);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: 32px 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
  }
  .panel::before, .panel::after,
  .panel .corner-l, .panel .corner-r{
    content:"";
    position:absolute;
    width:16px; height:16px;
    border-color: var(--brass);
    opacity:0.55;
  }
  .panel::before{ top:8px; left:8px; border-top:2px solid; border-left:2px solid; }
  .panel::after{ top:8px; right:8px; border-top:2px solid; border-right:2px solid; }
  .panel .corner-l{ bottom:8px; left:8px; border-bottom:2px solid var(--brass); border-left:2px solid var(--brass); }
  .panel .corner-r{ bottom:8px; right:8px; border-bottom:2px solid var(--brass); border-right:2px solid var(--brass); }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 22px;
    margin: 0 0 6px;
    font-weight:600;
  }
  h2{
    font-family:'Space Grotesk', sans-serif;
    font-size: 17px;
    margin: 0;
    font-weight:600;
  }
  .sub{
    color: var(--mute);
    font-size: 13.5px;
    margin: 0 0 26px;
    line-height:1.5;
  }

  .dropzone{
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 26px 16px;
    text-align:center;
    cursor:pointer;
    transition: border-color .15s, background .15s;
    background: var(--panel-raised);
    position:relative;
  }
  .dropzone:hover, .dropzone.drag{
    border-color: var(--brass);
    background: #262d3a;
  }
  .dropzone .slot{
    width:46px; height:8px;
    border-radius: 4px;
    background: var(--brass);
    opacity:0.85;
    margin: 0 auto 14px;
  }
  .dropzone p{ margin:0; font-size:13.5px; color: var(--paper); }
  .dropzone p.file-name{ color: var(--brass-bright); font-family:'IBM Plex Mono', monospace; font-size:12.5px; word-break:break-all; }
  .dropzone span{ display:block; margin-top:4px; font-size:12px; color: var(--mute); }
  input[type=file]{ display:none; }

  label.field-label{
    display:block;
    font-size:12px;
    color: var(--mute);
    margin: 20px 0 8px;
    letter-spacing:0.02em;
  }

  input[type=password], input[type=text]{
    width:100%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.12em;
    outline: none;
    transition: border-color .15s;
  }
  input[type=password]:focus, input[type=text]:focus{
    border-color: var(--brass);
  }

  .btn{
    width:100%;
    margin-top: 22px;
    padding: 13px 16px;
    border-radius: 8px;
    border: none;
    background: var(--brass);
    color: #1a1508;
    font-weight:600;
    font-size: 14.5px;
    cursor:pointer;
    transition: background .15s, transform .1s, opacity .15s;
    font-family: 'IBM Plex Sans KR', sans-serif;
  }
  .btn:hover:not(:disabled){ background: var(--brass-bright); }
  .btn:active:not(:disabled){ transform: scale(0.99); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .btn.secondary{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper);
  }
  .btn.secondary:hover:not(:disabled){ border-color: var(--rust); color: var(--rust-bright); background: rgba(193,89,75,0.08); }

  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  .btn-row .btn{ margin-top:0; }

  .msg{
    margin-top:16px;
    font-size:13px;
    padding: 10px 12px;
    border-radius:8px;
    line-height:1.5;
    display:none;
  }
  .msg.show{ display:block; }
  .msg.error{ background: rgba(193,89,75,0.12); color: var(--rust-bright); border:1px solid rgba(193,89,75,0.3); }
  .msg.success{ background: rgba(126,162,140,0.12); color: var(--sage); border:1px solid rgba(126,162,140,0.3); }

  /* ---- locker list ---- */
  .locker-section{ margin-top: 36px; }
  .locker-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 0 4px 14px;
  }
  .locker-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color: var(--mute);
  }

  .list-empty{
    text-align:center;
    color: var(--mute);
    font-size:13px;
    padding: 30px 20px;
    border: 1px dashed var(--line);
    border-radius:10px;
  }

  .list-item{
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:10px;
    background: var(--panel);
    overflow:hidden;
  }
  .list-item-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 13px 15px;
    cursor:pointer;
  }
  .list-item-head:hover{ background: var(--panel-raised); }
  .list-item-num{
    width:32px; height:32px;
    border-radius:7px;
    background: var(--panel-raised);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color: var(--brass-bright);
    flex-shrink:0;
  }
  .list-item-info{ flex:1; min-width:0; }
  .list-item-info .fname{
    font-size:13.5px;
    color: var(--paper);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .list-item-info .fmeta{
    font-size:11px;
    color: var(--mute);
    margin-top:3px;
    font-family:'IBM Plex Mono', monospace;
  }
  .list-item-chevron{
    color: var(--mute);
    font-size:16px;
    transition: transform .15s, color .15s;
    flex-shrink:0;
  }
  .list-item.open .list-item-chevron{ transform: rotate(90deg); color: var(--brass); }

  .list-item-body{
    max-height:0;
    overflow:hidden;
    transition: max-height .2s ease;
  }
  .list-item.open .list-item-body{ max-height: 300px; border-top: 1px solid var(--line); }
  .list-item-body-inner{ padding: 15px; }
  .list-item-body-inner .field-label{ margin-top:0; }

  footer{
    margin-top: 34px;
    font-size:11.5px;
    color: var(--mute);
    text-align:center;
    max-width:460px;
    line-height:1.6;
  }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="dial"></div>
    <div>
      <span>자물쇠함</span>
      <small>PASSWORD-LOCKED FILE DROP</small>
    </div>
  </div>

  <main>

    <!-- ============ 업로드 패널 ============ -->
    <section class="panel">
      <div class="corner-l"></div><div class="corner-r"></div>
      <h1>파일을 넣고 잠그세요</h1>
      <p class="sub">파일을 올리고 비밀번호를 정하면 보관함 목록에 추가돼요. 목록에서 파일을 고르고 같은 비밀번호를 입력하면 누구든 열어볼 수 있어요.</p>

      <div class="dropzone" id="dropzone">
        <div class="slot"></div>
        <p id="dropzone-text">클릭하거나 파일을 끌어다 놓으세요</p>
        <span id="dropzone-sub">최대 50MB</span>
        <input type="file" id="file-input" />
      </div>

      <label class="field-label">비밀번호 (4자 이상)</label>
      <input type="password" id="upload-password" placeholder="••••••••" autocomplete="new-password" />

      <button class="btn" id="upload-btn">넣고 잠그기</button>

      <div class="msg" id="upload-msg"></div>
    </section>

    <!-- ============ 보관함 목록 ============ -->
    <section class="locker-section">
      <div class="locker-head">
        <h2>보관함</h2>
        <span class="locker-count" id="locker-count">불러오는 중…</span>
      </div>
      <div id="locker-list"></div>
    </section>

  </main>

  <footer>
    비밀번호는 서버에 원문으로 저장되지 않고 해시로만 저장돼요.<br>
    파일은 비밀번호를 아는 사람만 꺼내거나 치울 수 있어요.
  </footer>

<script>
  // ---- Supabase 연결 정보 ----
  const SUPABASE_URL = "https://tqobntjhbaletlknbdoq.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxb2JudGpoYmFsZXRsa25iZG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Njg0MzQsImV4cCI6MjEwMTU0NDQzNH0.EPh5WrqRQsr4aIEjuJGkk_5SIkRMt0LSnBfU3LonkcQ";
  const FN_BASE = `${SUPABASE_URL}/functions/v1`;
  const MAX_BYTES = 50 * 1024 * 1024;
  const AUTH_HEADERS = { Authorization: `Bearer ${ANON_KEY}` };

  const $ = (id) => document.getElementById(id);

  function showMsg(el, text, type){
    el.textContent = text;
    el.className = `msg show ${type}`;
  }
  function clearMsg(el){
    el.className = "msg";
  }
  function formatSize(bytes){
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  }
  function formatDate(iso){
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // ---------- 업로드 ----------
  function initUpload(){
    const dropzone = $("dropzone");
    const fileInput = $("file-input");
    const dzText = $("dropzone-text");
    const dzSub = $("dropzone-sub");
    const uploadBtn = $("upload-btn");
    const msg = $("upload-msg");
    let selectedFile = null;

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("drag");
      if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    function setFile(file){
      selectedFile = file;
      dzText.textContent = file.name;
      dzText.classList.add("file-name");
      dzSub.textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB`;
      clearMsg(msg);
    }
    function resetDropzone(){
      selectedFile = null;
      fileInput.value = "";
      dzText.textContent = "클릭하거나 파일을 끌어다 놓으세요";
      dzText.classList.remove("file-name");
      dzSub.textContent = "최대 50MB";
    }

    uploadBtn.addEventListener("click", async () => {
      clearMsg(msg);
      const passwordInput = $("upload-password");
      const password = passwordInput.value;

      if (!selectedFile){
        showMsg(msg, "파일을 먼저 선택해주세요.", "error");
        return;
      }
      if (password.length < 4){
        showMsg(msg, "비밀번호는 4자 이상으로 정해주세요.", "error");
        return;
      }
      if (selectedFile.size > MAX_BYTES){
        showMsg(msg, "파일이 너무 커요. 최대 50MB까지 올릴 수 있어요.", "error");
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = "넣는 중…";

      try{
        const fd = new FormData();
        fd.append("file", selectedFile);
        fd.append("password", password);

        const res = await fetch(`${FN_BASE}/upload`, {
          method: "POST",
          headers: AUTH_HEADERS,
          body: fd
        });
        const data = await res.json();

        if (!res.ok || data.error){
          showMsg(msg, data.error || "업로드에 실패했어요.", "error");
          return;
        }

        showMsg(msg, "보관함에 넣고 잠갔어요. 아래 목록에서 확인하세요.", "success");
        resetDropzone();
        passwordInput.value = "";
        loadList();
      } catch(e){
        showMsg(msg, "네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.", "error");
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "넣고 잠그기";
      }
    });
  }

  // ---------- 보관함 목록 ----------
  let openItemId = null;

  async function loadList(){
    const countEl = $("locker-count");
    const listEl = $("locker-list");
    countEl.textContent = "불러오는 중…";

    try{
      const res = await fetch(`${FN_BASE}/list`, { headers: AUTH_HEADERS });
      const data = await res.json();

      if (!res.ok || data.error){
        countEl.textContent = "";
        listEl.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "list-empty";
        empty.textContent = "목록을 불러오지 못했어요.";
        listEl.appendChild(empty);
        return;
      }

      renderList(data.items || []);
    } catch(e){
      countEl.textContent = "";
      listEl.innerHTML = "";
      const empty = document.createElement("div");
      empty.className = "list-empty";
      empty.textContent = "네트워크 오류로 목록을 불러오지 못했어요.";
      listEl.appendChild(empty);
    }
  }

  function renderList(items){
    const countEl = $("locker-count");
    const listEl = $("locker-list");
    countEl.textContent = `${items.length}개`;
    listEl.innerHTML = "";

    if (items.length === 0){
      const empty = document.createElement("div");
      empty.className = "list-empty";
      empty.textContent = "아직 보관함이 비어있어요. 위에서 파일을 넣어보세요.";
      listEl.appendChild(empty);
      return;
    }

    items.forEach((item, index) => {
      listEl.appendChild(buildListItem(item, index));
    });
  }

  function buildListItem(item, index){
    const wrap = document.createElement("div");
    wrap.className = "list-item";
    wrap.dataset.id = item.id;

    // ---- head (클릭해서 펼치기) ----
    const head = document.createElement("div");
    head.className = "list-item-head";

    const num = document.createElement("div");
    num.className = "list-item-num";
    num.textContent = String(index + 1).padStart(2, "0");

    const info = document.createElement("div");
    info.className = "list-item-info";
    const fname = document.createElement("div");
    fname.className = "fname";
    fname.textContent = item.filename; // textContent로만 넣어서 XSS 방지
    const fmeta = document.createElement("div");
    fmeta.className = "fmeta";
    fmeta.textContent = `${formatSize(item.size || 0)} · ${formatDate(item.created_at)}`;
    info.appendChild(fname);
    info.appendChild(fmeta);

    const chevron = document.createElement("div");
    chevron.className = "list-item-chevron";
    chevron.textContent = "›";

    head.appendChild(num);
    head.appendChild(info);
    head.appendChild(chevron);

    // ---- body (비밀번호 + 다운로드/삭제) ----
    const body = document.createElement("div");
    body.className = "list-item-body";

    const bodyInner = document.createElement("div");
    bodyInner.className = "list-item-body-inner";

    const label = document.createElement("label");
    label.className = "field-label";
    label.textContent = "비밀번호";

    const pwInput = document.createElement("input");
    pwInput.type = "password";
    pwInput.placeholder = "••••••••";
    pwInput.autocomplete = "off";

    const btnRow = document.createElement("div");
    btnRow.className = "btn-row";

    const downloadBtn = document.createElement("button");
    downloadBtn.className = "btn";
    downloadBtn.textContent = "꺼내기 (다운로드)";

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "btn secondary";
    deleteBtn.textContent = "치우기 (삭제)";

    btnRow.appendChild(downloadBtn);
    btnRow.appendChild(deleteBtn);

    const itemMsg = document.createElement("div");
    itemMsg.className = "msg";

    bodyInner.appendChild(label);
    bodyInner.appendChild(pwInput);
    bodyInner.appendChild(btnRow);
    bodyInner.appendChild(itemMsg);
    body.appendChild(bodyInner);

    wrap.appendChild(head);
    wrap.appendChild(body);

    head.addEventListener("click", () => {
      const isOpen = wrap.classList.contains("open");
      // 아코디언: 하나만 펼쳐지게
      document.querySelectorAll(".list-item.open").forEach((el) => {
        if (el !== wrap) el.classList.remove("open");
      });
      wrap.classList.toggle("open", !isOpen);
      if (!isOpen) pwInput.focus();
    });

    downloadBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      clearMsg(itemMsg);
      const password = pwInput.value;
      if (!password){
        showMsg(itemMsg, "비밀번호를 입력해주세요.", "error");
        return;
      }
      downloadBtn.disabled = true;
      downloadBtn.textContent = "확인 중…";
      try{
        const res = await fetch(`${FN_BASE}/download`, {
          method: "POST",
          headers: { ...AUTH_HEADERS, "Content-Type": "application/json" },
          body: JSON.stringify({ id: item.id, password })
        });
        const data = await res.json();
        if (!res.ok || data.error){
          showMsg(itemMsg, data.error || "비밀번호가 올바르지 않아요.", "error");
          return;
        }
        showMsg(itemMsg, `"${data.filename}" 다운로드를 시작해요.`, "success");
        window.location.href = data.url;
      } catch(e){
        showMsg(itemMsg, "네트워크 오류가 발생했어요.", "error");
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = "꺼내기 (다운로드)";
      }
    });

    deleteBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      clearMsg(itemMsg);
      const password = pwInput.value;
      if (!password){
        showMsg(itemMsg, "비밀번호를 입력해주세요.", "error");
        return;
      }
      if (!confirm(`"${item.filename}"을(를) 보관함에서 치울까요? 되돌릴 수 없어요.`)){
        return;
      }
      deleteBtn.disabled = true;
      downloadBtn.disabled = true;
      deleteBtn.textContent = "치우는 중…";
      try{
        const res = await fetch(`${FN_BASE}/delete`, {
          method: "POST",
          headers: { ...AUTH_HEADERS, "Content-Type": "application/json" },
          body: JSON.stringify({ id: item.id, password })
        });
        const data = await res.json();
        if (!res.ok || data.error){
          showMsg(itemMsg, data.error || "비밀번호가 올바르지 않아요.", "error");
          deleteBtn.disabled = false;
          downloadBtn.disabled = false;
          deleteBtn.textContent = "치우기 (삭제)";
          return;
        }
        loadList();
      } catch(e){
        showMsg(itemMsg, "네트워크 오류가 발생했어요.", "error");
        deleteBtn.disabled = false;
        downloadBtn.disabled = false;
        deleteBtn.textContent = "치우기 (삭제)";
      }
    });

    return wrap;
  }

  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();
    const blockCombo =
      key === "f12" ||
      ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i", "j", "c"].includes(key)) ||
      ((e.ctrlKey || e.metaKey) && key === "u");
    if (blockCombo) e.preventDefault();
  });

  initUpload();
  loadList();
</script>

</body>
</html>
