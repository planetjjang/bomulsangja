<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Supabase File Share</title>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>1. 파일 업로드</h2>
  <input type="file" id="fileInput" />
  <button onclick="uploadFile()">업로드</button>

  <hr />

  <h2>2. 파일 다운로드 (다른 브라우저에서 사용)</h2>
  <input type="text" id="filePathInput" placeholder="파일명 입력 (예: 1712345678_test.png)" style="width: 300px;" />
  <button onclick="downloadFile()">다운로드</button>
  <button onclick="getPublicLink()">웹에서 바로 열기/링크 복사</button>

  <script>
    // Supabase 정보 설정 (프로젝트 Settings -> API에서 확인)
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'uploads';

    // 파일 업로드 함수
    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) return alert('파일을 선택해주세요.');

      // 파일명 중복 방지를 위해 타임스탬프 추가
      const filePath = `${Date.now()}_${file.name}`;

      const { data, error } = await supabase.storage
        .from(BUCKET_NAME)
        .upload(filePath, file);

      if (error) {
        console.error('업로드 실패:', error);
        alert('업로드 실패: ' + error.message);
      } else {
        alert(`업로드 성공!\n파일명: ${data.path}`);
        console.log('Uploaded File Path:', data.path);
      }
    }

    // Blob 기반 강제 다운로드 함수
    async function downloadFile() {
      const path = document.getElementById('filePathInput').value;
      if (!path) return alert('파일명을 입력해주세요.');

      const { data, error } = await supabase.storage
        .from(BUCKET_NAME)
        .download(path);

      if (error) {
        console.error('다운로드 실패:', error);
        alert('다운로드 실패: ' + error.message);
        return;
      }

      // 브라우저 다운로드 트리거
      const url = URL.createObjectURL(data);
      const a = document.createElement('a');
      a.href = url;
      a.download = path.split('_').slice(1).join('_') || path; // 타임스탬프 제외 원본 파일명 설정
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Public URL 추출 함수 (바로 보기 / 링크 공유용)
    function getPublicLink() {
      const path = document.getElementById('filePathInput').value;
      if (!path) return alert('파일명을 입력해주세요.');

      const { data } = supabase.storage
        .from(BUCKET_NAME)
        .getPublicUrl(path);

      window.open(data.publicUrl, '_blank');
    }
  </script>
</body>
</html>
